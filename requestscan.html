<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اسکن حواله</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: #f4f6f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h3 {
            margin-bottom: 15px;
            color: #1a252f;
        }
        .scan-container {
            max-width: 100%;
            max-height: 80vh;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
            padding: 10px;
        }
        img {
            max-width: 100%;
            max-height: 75vh;
            display: block;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h3>تصویر برگه اسکن شده حواله</h3>
    <div class="scan-container">
        <img id="scan-image" src="" alt="برگه اسکن شده">
    </div>
</body>
</html>
